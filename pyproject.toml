[project]
name = "issue-to-patch"
version = "0.0.0"
description = "RAG-based automation pipeline that turns a GitHub issue into a validated .patch file."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "openai>=1.50",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
issue-to-patch = "issue_to_patch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_to_patch"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (Principle 1: keep the core small and readable)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/issue_to_patch/persistence/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes + pycodestyle
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "A",                # builtins shadowing
    "C4",               # comprehensions
    "SIM",              # simplify
    "PTH",              # use pathlib
    "RUF",
]
ignore = [
    "A003",   # class attribute shadowing a builtin is fine for pydantic models
    "N818",   # domain exceptions read better without a forced "Error" suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# mypy — strict on the source tree
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["issue_to_patch"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "tree_sitter_python.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=issue_to_patch --cov-report=term-missing"
markers = [
    "integration: exercises multiple components together",
    "adversarial: stress / red-team cases",
]

[tool.coverage.run]
branch = true
source = ["src/issue_to_patch"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
